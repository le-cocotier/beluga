name: Build project

on:
  push:
    branches: ["main", "develop"]

jobs:
  build:
    runs-on: giorgio-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          tokens: ${{ secrets.GITEA_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc python3

      - name: Configure Meson
        run: meson setup build

      - name: Build project
        run: meson compile -C build

      - name: Run tests (includes the OS-boundary check)
        run: meson test -C build --print-errorlogs

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: beluga
          path: build/beluga

  sanitizers:
    runs-on: giorgio-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          tokens: ${{ secrets.GITEA_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc python3

      # AddressSanitizer (with LeakSanitizer) and UBSan. meson test sets
      # halt_on_error, so any report fails the unit tests or the smoke test.
      - name: Configure Meson (ASan + UBSan)
        run: meson setup build-san -Db_sanitize=address,undefined -Db_lundef=false

      - name: Build project
        run: meson compile -C build-san

      - name: Run tests under the sanitizers
        run: meson test -C build-san --print-errorlogs

  build-windows:
    runs-on: giorgio-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          tokens: ${{ secrets.GITEA_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 wine

      # cross/wine.ini adds Wine as the exe wrapper, so meson test runs
      # the Windows test programs (and so os_win32.c) under Wine.
      - name: Configure Meson (cross-compiling for Windows)
        run: meson setup --cross-file cross/mingw-w64.ini --cross-file cross/wine.ini build-windows

      - name: Build project
        run: meson compile -C build-windows

      - name: Run tests under Wine (includes the OS-boundary check)
        env:
          WINEDEBUG: -all
        run: meson test -C build-windows --print-errorlogs

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: beluga-windows
          path: build-windows/beluga.exe
