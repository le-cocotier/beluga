# Cross-compiling beluga.exe from Linux with MinGW-w64 (Debian/Ubuntu: apt install mingw-w64):
#   meson setup --cross-file cross/mingw-w64.ini build-windows && meson compile -C build-windows

[binaries]
c = 'x86_64-w64-mingw32-gcc'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
